name: Postavljanje na lektorilibra.rs

# Pokreće se posle svake izmene na grani main, ili ručno (Actions → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Provera podešavanja
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP tajne još nisu upisane (Settings → Secrets and variables → Actions). Postavljanje je preskočeno."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Priprema produkcione verzije
        if: env.FTP_SERVER != ''
        run: |
          mkdir dist
          cp -r index.html 404.html posalji.php robots.txt sitemap.xml .htaccess .user.ini img uslovi-koriscenja politika-privatnosti dist/
          # Na pravom domenu sajt je vidljiv Google-u (GitHub Pages pregled ostaje noindex)
          for f in dist/index.html dist/uslovi-koriscenja/index.html dist/politika-privatnosti/index.html; do
            sed -i -e '/<!-- PREGLED/d' \
                   -e 's|<meta name="robots" content="noindex, nofollow">|<meta name="robots" content="index, follow, max-image-preview:large">|' "$f"
          done
          grep -L 'noindex' dist/index.html dist/uslovi-koriscenja/index.html dist/politika-privatnosti/index.html
          find dist -type f | sort

      - name: Slanje na hosting (FTP)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
